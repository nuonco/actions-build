name: Build Component
description: Build a Nuon component.
branding:
  icon: 'package'
  color: 'purple'
inputs:
  org_id:
    description: Your Nuon org ID.
    required: true
  api_token:
    description: A Nuon API token. Omit when using GitHub Actions OIDC.
    required: false
  component_id:
    description: The Nuon component you want to build.
    required: true
  app_id:
    description: The Nuon app the component belongs to.
    required: true
  api_url:
    description: The URL of the Nuon API.
    required: false
    default: https://api.nuon.co
outputs:
  build_id:
    description: The build that was created.
    value: ${{ steps.build.outputs.build_id }}
runs:
  using: composite
  steps:
    - name: Install CLI
      run: "${{ github.action_path }}/install.sh"
      shell: bash
    - name: Create build
      id: build
      run: "${{ github.action_path }}/build.sh"
      shell: bash
      env:
        NUON_ORG_ID: ${{ inputs.org_id }}
        NUON_API_TOKEN: ${{ inputs.api_token }}
        COMPONENT_ID: ${{ inputs.component_id }}
        NUON_API_URL: ${{ inputs.api_url }}
        NUON_APP_ID: ${{ inputs.app_id }}
